<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한 줄 사색</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="scene" aria-label="밤 숲속에서 타오르는 모닥불"></canvas>
<div class="vignette"></div>

<header>
  <h1>한 줄 사색</h1>
  <p class="hint">마음에 걸린 생각을 한 줄 적어 불에 던져 보세요.<br>타닥타닥 타는 동안 잠깐 멍하니 있어도 좋아요.</p>
  <p class="note" id="note" role="status" aria-live="polite"></p>
</header>

<div class="wx" role="group" aria-label="날씨">
  <button type="button" data-mode="clear" aria-pressed="true">맑음</button>
  <button type="button" data-mode="rain" aria-pressed="false">비</button>
  <button type="button" data-mode="snow" aria-pressed="false">눈</button>
</div>
<div class="pl" role="group" aria-label="장소">
  <button type="button" data-place="forest" aria-pressed="true">숲 불멍</button>
  <button type="button" data-place="beach" aria-pressed="false">바닷가</button>
</div>
<button class="sound" id="sound" type="button" aria-pressed="false">소리 켜기</button>
<div class="count" id="count">태운 생각 0개</div>

<div class="panel" id="panel">
  <p class="keep" id="keep">쓴 글은 어디에도 저장되지 않고, 다 타면 사라져요.</p>
  <div class="row">
    <input id="thought" type="text" maxlength="40" autocomplete="off" placeholder="예: 그때 그 말이 자꾸 생각나요" aria-label="태울 생각 한 줄">
    <button id="burn" type="button">태우기</button>
  </div>
  <label class="share" for="share"><input type="checkbox" id="share"> 내 글도 지금 함께 있는 사람에게 별빛으로 보여주기 (끄면 글 없이 별빛만)</label>
</div>

<script src="app.js"></script>
</body>
</html>
